    <main>

      <section id="intro">

      <section id="kontakt">
        <h2>Kontakt</h2>
        <p>
          Am besten erreichst du mich per E-Mail.
        </p>
        <button type="button" id="copy-email" class="copy-email" aria-live="polite">
          <span class="copy-email-label">Drücke <kbd>C</kbd>, um meine E-Mail-Adresse zu kopieren</span>

    <svg class="footer-wave" viewBox="0 0 60 3" preserveAspectRatio="none" aria-hidden="true">

    </svg>
    <div class="footer-inner">

  </footer>

  <script>
  (function () {
    var btn = document.getElementById('copy-email');
    if (!btn) return;
    var label = btn.querySelector('.copy-email-label');
    var defaultHTML = label.innerHTML;

    // ---- E-Mail-Adresse (zum Ändern hier anpassen) ----
    var user = 'laenglich.stueck5a';
    var host = 'icloud.com';
    var email = user + '@' + host;

    var resetTimer;

    function showCopied() {
      btn.classList.add('copied');
      label.textContent = 'E-Mail-Adresse in die Zwischenablage kopiert';
      clearTimeout(resetTimer);
      resetTimer = setTimeout(function () {
        btn.classList.remove('copied');
        label.innerHTML = defaultHTML;
      }, 4000);
    }

    function fallbackCopy() {
      var ta = document.createElement('textarea');
      ta.value = email;
      ta.setAttribute('readonly', '');
      ta.style.position = 'absolute';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      showCopied();
    }

    function copyEmail() {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(email).then(showCopied, fallbackCopy);
      } else {
        fallbackCopy();
      }
    }

    document.addEventListener('keydown', function (e) {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      var t = e.target || {};
      var tag = (t.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea' || t.isContentEditable) return;
      if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        copyEmail();
      }
    });

    btn.addEventListener('click', copyEmail);
  })();
  </script>
</body>
